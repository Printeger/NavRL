defaults:
  - _self_
  - drone
  - ppo
  - sim

headless: True
device: "cuda:0"
seed: 0

# Total Training Length
max_frame_num: 12e8 # max frame 
eval_interval: 1000 # evaluate the policy for every N training steps
save_interval: 1000

# Training Environment ⭐ 必须修改
env:
  num_envs: 512 # Number of drones for training - 根据GPU内存调整
  max_episode_length: 2200 # 最大episode长度 - 根据任务复杂度调整
  env_spacing: 8.0
  num_obstacles: 350 # 静态障碍物数量 - 根据地图大小调整

env_dyn:
  num_obstacles: 80 # 动态障碍物数量 - 设为0则无动态障碍物
  vel_range: [0.5, 1.5] # 动态障碍物速度范围 [min, max]
  local_range: [5.0, 5.0, 4.5] # 动态障碍物移动范围 [x, y, z]

viewer:
  eye: [0., 40., 40.]
  lookat: [0., 2.5, 0.]
  resolution: [960, 720]

wandb:
  project: NavRL
  name: navigation_training
  entity: CERLAB-UAV-RL-Navigation
  mode: offline # online
  run_id: #kw9xf9k9

# ============================================
# instinctRL Configuration
# ============================================
instinctRL:
  enabled: true                        # Enable instinctRL mode
  mode: "smoke"                        # smoke: B0/B observation smoke | train: PPO path
  task: "command_governor"             # Active handbook task; legacy target-goal stats are diagnostics only
  baseline:
    id: "direct_velocity"             # B0: direct velocity pass-through

  # instinctRL command curriculum. station_first keeps recovery/null-command
  # samples dominant before mixed tracking/adversarial commands are introduced.
  command:
    source: "curriculum_generator"     # curriculum_generator | basic_random | scripted_eval
    max_vel: 1.0
    curriculum_profile: "station_first"

  # instinctRL-B: Observation Configuration
  observation:
    history_len: 4                     # History buffer window size
    enable_noise: false                # MID360 range noise (deferred)
    enable_dropout: false              # MID360 random dropout (deferred)
    tau_staleness: 0.5                 # Staleness time constant (seconds)
    # Options: direct_velocity, no_history, no_anchor, no_imu, no_ics, ...

  # instinctRL-C: Measurement-space anchor manager
  anchor:
    enabled: true                      # Passive scalar diagnostics + internal dense cache
    eps_enter: 0.05                    # Capture when ||v_cmd|| <= eps_enter
    eps_exit: 0.15                     # Reset when ||v_cmd|| >= eps_exit
    min_valid_anchor_fraction: 0.10    # Invalid reset below this fixed-grid fraction
    huber_delta: 0.25                  # Per-beam Huber delta for anchor_loss
    reset_on_large_command: true       # Large command exits null-command anchor

  # instinctRL-D: Evaluation-only observability logger
  observability:
    enabled: false                     # Passive logging only; no actor input changes
    mode: "offline"                   # offline chooses FD/normals if supplied, else proxy
    rank_tol: 0.0001                  # Singular-value threshold for rank estimate
    condition_number_cap: 1000000.0   # Finite cap for singular/degenerate cases
    min_valid_fraction: 0.01          # Logging threshold; does not affect actor input
    log_interval: 50                  # Intended runtime logging interval
    use_surface_normals: false        # Offline-only; never deployed actor/control input
    use_finite_difference: true       # Offline estimator if FD samples are supplied

  # instinctRL-E: ICS-inspired deployed-safe command attenuation
  ics:
    enabled: true
    d_safe: 0.8
    emergency_clearance: 0.25
    active_horizon_margin: 0.5
    a_max: 2.0
    latency_sec: 0.0
    clearance_margin: 0.0
    min_reliability: 0.1
    approach_eps: 0.001
    range_rate_eps: 0.001
    use_range_rate_filter: false
    velocity_limit: 2.0
    range_rate_mode: "finite_difference"
    empty_active_set_beta: 1.0
    brake_mode: "zero"

  # instinctRL-F: Reward integration/readiness, not convergence proof
  reward:
    enabled: true
    tracking_weight: 1.0
    anchor_weight: 4.0
    safety_weight: 0.5
    ics_compliance_weight: 1.0
    intervention_weight: 0.05
    smoothness_weight: 0.05
    null_command_speed_weight: 2.0
    null_command_output_weight: 0.1
    null_output_anchor_loss_threshold: 0.05
    proxy_tracking_weight: 0.25
    preservation_low_weight: 0.5
    preservation_high_weight: 0.5
    preservation_lower: 0.75
    preservation_upper: 1.05
    command_amplification_weight: 0.5
    height_floor: 0.5
    height_floor_weight: 8.0
    height_ceiling: 4.0
    height_ceiling_weight: 0.0
    collision_weight: 10.0
    clearance_safe: 0.8
    clearance_margin: 0.2
    max_reward_abs: 20.0
    use_privileged_velocity_for_reward: true
    min_anchor_valid_fraction: 0.1
    tracking_beta_gate: true
