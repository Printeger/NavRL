algo:
  feature_extractor:
    learning_rate: 5e-4
    dyn_obs_num: 5
  
  actor:
    learning_rate: 5e-4
    clip_ratio: 0.1
    action_limit: 2.0 # m/s
    beta_alpha_min: 1.0
    beta_alpha_max: 30.0
    beta_beta_min: 1.0
    beta_beta_max: 30.0
    action_eps: 1e-6
  
  critic:
    learning_rate: 5e-4
    clip_ratio: 0.1
  
  entropy_loss_coefficient: 1e-3 # encourage exploration
  max_grad_norm: 0.5
  target_kl: 0.02
  finite_audit: true
  diagnostic_dir: "ppo_diagnostics"
  value_norm:
    # Critic bootstrap values are used only to estimate GAE targets. For this
    # task, per-step rewards are O(1), so true discounted returns should remain
    # far below this bound. The bound prevents critic/value-normalization
    # feedback from creating unphysical 1e16-scale targets during long runs.
    max_abs_bootstrap: 1000.0
    max_abs_return: 1000.0
  training_frame_num: 32
  training_epoch_num: 4
  num_minibatches: 16 # split into N minibatches

  # ============================================
  # instinctRL Governor Configuration
  # ============================================
  instinctRL:
    governor:
      alpha_mode: "learned"            # "fixed" (B0/direct baseline) | "learned" (A2)
      alpha_fixed: 1.0                 # Fixed alpha for B0
      v_corr_limit: 0.5                # Max |v_corr| per axis (m/s)
      v_corr_z_limit: null             # Null inherits v_corr_limit; optional vertical correction limit
      velocity_limit: 2.0              # Max ||v_gov|| (m/s)
      smoothing_tau: 0.0               # Exponential smoothing factor (0 = off)
      null_vcorr_gate_enabled: true    # Soft null prior: allow small station correction at null command
      null_vcorr_gate_eps: 0.25        # Ramp v_corr from soft minimum to full strength by this command norm
      null_vcorr_gate_min: 0.25        # Retain 25% correction authority at exactly null command
      tracking_vcorr_z_gate_enabled: false # Default-off vertical correction attenuation during vertical tracking
      tracking_vcorr_z_gate_eps: 1e-3   # Tracking-active when abs(v_cmd_b.z) exceeds this threshold
      tracking_vcorr_z_gain: 1.0        # 1.0 preserves current behavior; 0.0 hard-gates active tracking z correction
