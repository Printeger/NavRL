algo:
  feature_extractor:
    learning_rate: 5e-4
    dyn_obs_num: 5
  
  actor:
    learning_rate: 5e-4
    clip_ratio: 0.1
    action_limit: 2.0 # m/s
  
  critic:
    learning_rate: 5e-4
    clip_ratio: 0.1
  
  entropy_loss_coefficient: 1e-3 # encourage exploration
  training_frame_num: 32
  training_epoch_num: 4
  num_minibatches: 16 # split into N minibatches

  # ============================================
  # instinctRL Governor Configuration
  # ============================================
  instinctRL:
    governor:
      alpha_mode: "fixed"              # "fixed" (B0) | "learned" (deferred)
      alpha_fixed: 1.0                 # Fixed alpha for B0
      v_corr_limit: 0.0                # Max |v_corr| per axis (m/s). 0 = no correction (B0)
      velocity_limit: 2.0              # Max |v_gov| per axis (m/s)
      smoothing_tau: 0.0               # Exponential smoothing factor (0 = off)